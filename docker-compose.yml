services:
  gpt-researcher:
    build: .
    container_name: gpt-researcher
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - RETRIEVER=firecrawl
    volumes:
      - ./outputs:/app/outputs
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
